<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON - Mis Clases</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══════════════════════════════════════ CLASSES SCREEN ═══ -->
  <div id="screen-classes" class="screen active">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-moon">MOON</span>
        <span class="brand-sep">|</span>
        <span class="brand-sub">Mis Clases</span>
      </div>
      <div class="topbar-user">
        <button class="btn" onclick="window.location.href='index.html'" style="border: 1px solid var(--accent-cyan); color: var(--accent-cyan); background: transparent;">🏠 Menú</button>
      </div>
    </header>
    
    <div class="teacher-dashboard" style="padding: 40px; max-width: 1000px; margin: 0 auto; color: white;">
      
      <!-- Controles Docente -->
      <div class="teacher-actions" id="classes-actions-teacher" style="display: none; gap: 20px; margin-bottom: 30px;">
        <button id="btn-import-class" class="btn btn-execute">📥 Importar de Classroom</button>
        <button id="btn-create-class" class="btn btn-outline">➕ Crear Manual</button>
      </div>
      
      <!-- Controles Alumno -->
      <div class="teacher-actions" id="classes-actions-student" style="display: none; gap: 10px; margin-bottom: 30px;">
        <input type="text" id="input-join-code" class="input-glass" placeholder="Código de Clase (ej. X7B9)">
        <button id="btn-join-class" class="btn btn-execute">Unirse</button>
      </div>
      
      <!-- Lista de clases -->
      <div class="teacher-content bg-panel" id="classes-list">
        <p style="color: rgba(255,255,255,0.5);">Cargando clases...</p>
      </div>

      <!-- Detalles de Clase (Oculto inicialmente) -->
      <div id="class-detail" class="teacher-content bg-panel" style="display: none; padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
          <h2 id="detail-class-name" style="margin: 0; color: var(--accent-cyan); font-family: 'Orbitron', sans-serif; font-size: 1.8rem;"></h2>
          <button id="btn-back-classes" class="btn btn-outline">🔙 Volver</button>
        </div>
        
        <div class="detail-grid">
          <!-- Columna Alumnos -->
          <div class="detail-column">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px; margin-bottom: 15px;">
              <h3 id="students-column-title" style="margin: 0; color: #fff; font-family: 'Orbitron', sans-serif;">👥 Progreso de Alumnos</h3>
              <button id="btn-refresh-students" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem; display: none;" title="Buscar alumnos que acaban de registrarse">🔄 Actualizar</button>
            </div>
            <div id="detail-students-list" class="detail-list">
              <p style="color: rgba(255,255,255,0.5);">Cargando alumnos...</p>
            </div>
          </div>
          
          <!-- Columna Tareas -->
          <div class="detail-column">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid rgba(0, 229, 255, 0.3); padding-bottom: 10px;">
              <h3 style="margin: 0; color: #fff; font-family: 'Orbitron', sans-serif;">📝 Tareas y Notas</h3>
              <button id="btn-create-task" class="btn btn-execute" style="padding: 8px 16px; font-size: 0.9rem;">➕ Nueva Tarea</button>
            </div>
            <div id="detail-tasks-list" class="detail-list">
              <p style="color: rgba(255,255,255,0.5);">Cargando tareas...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Student History Modal -->
  <div id="student-history-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div style="background: var(--bg-card, #0f1c2e); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 30px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0,229,255,0.2); position: relative;">
      <h3 id="student-history-title" style="margin-top: 0; color: var(--accent-cyan); font-family: 'Orbitron', sans-serif;">Historial de Partidas</h3>
      <button id="btn-close-history" class="btn btn-outline" style="position: absolute; top: 20px; right: 20px; padding: 4px 10px; font-size: 0.8rem;">Cerrar</button>
      <div id="student-history-list" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
        <p style="color: rgba(255,255,255,0.5);">Cargando historial...</p>
      </div>
    </div>
  </div>

  <!-- Custom Modal Overlay -->
  <div id="custom-modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div style="background: var(--bg-card, #0f1c2e); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 0 30px rgba(0,229,255,0.2);">
      <h3 id="custom-modal-title" style="margin-top: 0; color: var(--accent-cyan); font-family: 'Orbitron', sans-serif;">Aviso</h3>
      <p id="custom-modal-text" style="color: rgba(255,255,255,0.8); margin-bottom: 20px; line-height: 1.5; white-space: pre-wrap;"></p>
      <input type="text" id="custom-modal-input" class="input-glass" style="width: 100%; margin-bottom: 20px; display: none;" />
      <div style="display: flex; justify-content: flex-end; gap: 15px;">
        <button id="custom-modal-cancel" class="btn btn-outline" style="padding: 8px 16px;">Cancelar</button>
        <button id="custom-modal-ok" class="btn btn-execute" style="padding: 8px 24px;">Aceptar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/classes.js"></script>
</body>
</html>
