<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON - Centro de Control</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══════════════════════════════════════ MAIN MENU SCREEN ═══ -->
  <div id="screen-menu" class="screen" style="display:none;">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-moon">MOON</span>
        <span class="brand-sep">|</span>
        <span class="brand-sub">Centro de Control</span>
      </div>
      <div class="topbar-user">
        <div class="user-profile" id="menu-profile">
          <img id="menu-avatar" class="user-avatar" src="" alt="Avatar">
          <span id="menu-name" class="user-name"></span>
          <button id="btn-logout-menu" class="btn-logout" title="Cerrar sesión">Salir</button>
        </div>
      </div>
    </header>
    
    <div class="menu-dashboard" style="padding: 40px; max-width: 1000px; margin: 0 auto; text-align: center;">
      <h2 style="font-family: 'Orbitron'; color: var(--accent-cyan); margin-bottom: 40px; font-size: 2rem;">¿Qué quieres hacer?</h2>
      <div style="display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;">
        
        <div class="menu-card" id="btn-nav-game">
          <div style="font-size: 3rem; margin-bottom: 15px;">🕹️</div>
          <h3 style="color: white; font-family: 'Orbitron';">Partida Libre</h3>
          <p style="color: rgba(255,255,255,0.6);">Entrena y mejora tu récord.</p>
        </div>
        
        <div class="menu-card" id="btn-nav-classes">
          <div style="font-size: 3rem; margin-bottom: 15px;">👥</div>
          <h3 style="color: white; font-family: 'Orbitron';">Mis Clases</h3>
          <p style="color: rgba(255,255,255,0.6);" id="desc-nav-classes">Únete a una clase.</p>
        </div>
      </div>

      <!-- Registro de Partidas -->
      <div style="margin-top: 50px; text-align: left; background: rgba(0,0,0,0.2); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
        <h3 style="color: var(--accent-cyan); font-family: 'Orbitron', sans-serif; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 10px; margin-bottom: 20px;">📜 Registro de mis partidas</h3>
        <div id="games-history-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;">
          <p style="color: rgba(255,255,255,0.5);">Cargando historial...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ AUTH OVERLAY ═══════ -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <h2 class="auth-title">🚀 Bienvenido a MOON</h2>
      <p class="auth-sub">Selecciona tu perfil para identificarte con Google.</p>
      <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
        <button id="btn-login" class="btn btn-execute">Entrar como Alumno</button>
        <button id="btn-login-teacher" class="btn" style="background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);">Soy Docente</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>
</html>
