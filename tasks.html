<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOON - Mis Tareas</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══════════════════════════════════════ TASKS SCREEN ═══ -->
  <div id="screen-tasks" class="screen active">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-moon">MOON</span>
        <span class="brand-sep">|</span>
        <span class="brand-sub">Mis Tareas</span>
      </div>
      <div class="topbar-user">
        <button class="btn" onclick="window.location.href='index.html'" style="border: 1px solid var(--accent-cyan); color: var(--accent-cyan); background: transparent;">🏠 Menú</button>
      </div>
    </header>
    
    <div class="teacher-dashboard" style="padding: 40px; max-width: 1000px; margin: 0 auto; color: white;">
      
      <!-- Controles Docente -->
      <div class="teacher-actions" id="tasks-actions-teacher" style="display: none; gap: 20px; margin-bottom: 30px;">
        <button id="btn-create-task" class="btn btn-execute">📝 Nueva Tarea</button>
      </div>
      
      <!-- Lista de tareas -->
      <div class="teacher-content bg-panel" id="tasks-list" style="padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-height: 200px;">
        <p style="color: rgba(255,255,255,0.5);">Cargando tareas...</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/tasks.js"></script>
</body>
</html>
